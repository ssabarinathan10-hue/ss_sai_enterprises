<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SS Sai Enterprises — Sarees &amp; Indian Ethnic Fashion</title>
<meta name="description" content="Discover timeless sarees and Indian ethnic fashion at SS Sai Enterprises. Premium silk, cotton, designer and bridal sarees curated by Vimala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/js/config.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root{
  --wine:#641B2E;--burg:#431321;--dark-burg:#2A0913;
  --ivory:#FFF9F1;--beige:#EDE0D0;--gold:#C6A15B;--gold-l:#E8CF94;
  --ink:#292321;--mute:#6f625c;--card:#fff;
  --line:rgba(198,161,91,.35);--line2:rgba(198,161,91,.18);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ivory:#1d0d12;--beige:#2a141b;--ink:#f3e9dd;--card:#26121a;--mute:#bfae9f
}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 15px/1.6 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none}
.w{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:block}

/* ── ANNOUNCEMENT ───────────────────────────────────────────── */
.ann{background:var(--burg);color:#f3dfb6;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:8px 10px}

/* ── NAVBAR ─────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:rgba(255,249,241,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .4s,box-shadow .4s}
header.scrolled{box-shadow:0 4px 30px rgba(67,19,33,.12)}
@media(prefers-color-scheme:dark){header{background:rgba(29,13,18,.92)}}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{text-align:center;line-height:1}.logo b{display:block;font:600 24px 'Cormorant Garamond',serif;letter-spacing:.16em;color:var(--wine)}
.logo small{font-size:8.5px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
@media(prefers-color-scheme:dark){.logo b{color:#e8cf94}}
.links{display:flex;gap:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.links a{padding:6px 0;border-bottom:1px solid transparent;transition:.3s;position:relative}
.links a:hover{border-color:var(--gold);color:var(--wine)}
.ic{display:flex;gap:4px}
.ic button,.burger{background:none;border:0;color:inherit;width:40px;height:40px;position:relative;font-size:18px;display:flex;align-items:center;justify-content:center}
.ic sup{position:absolute;top:4px;right:2px;background:var(--wine);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:15px}
.burger{display:none;font-size:22px}
@media(max-width:960px){.links{display:none}.burger{display:flex}.links.open{display:flex;position:absolute;top:72px;left:0;right:0;flex-direction:column;background:var(--ivory);padding:16px 24px;border-bottom:1px solid var(--line);gap:6px;z-index:30}}
.search{display:none;padding:10px 0 14px}.search.on{display:block}
.search input,.f input,.f select,.f textarea,.sort{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:2px}

/* ── BUTTONS ─────────────────────────────────────────────────── */
.btn{display:inline-block;padding:15px 30px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--wine);background:var(--wine);color:#fff9f1;transition:.35s;text-align:center;cursor:pointer}
.btn:hover{background:var(--burg);box-shadow:0 8px 28px rgba(67,19,33,.35);transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--wine);border-color:var(--gold)}.btn.o:hover{background:var(--wine);color:#fff;transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:var(--dark-burg);border-color:var(--gold)}.btn.gold:hover{background:var(--gold-l)}
@media(prefers-color-scheme:dark){.btn.o{color:#e8cf94}}

/* ═══════════════════════════════════════════════════════════════
   CINEMATIC HERO
   ═══════════════════════════════════════════════════════════════ */
.cinematic-hero{
  position:relative;height:100svh;min-height:560px;max-height:960px;
  overflow:hidden;display:flex;align-items:center;
  background:var(--dark-burg);
}

/* Slideshow slides */
.ch-slide{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.2s ease;
  animation:chZoom 14s ease-in-out infinite;
}
.ch-slide.active{opacity:1}
.ch-slide:nth-child(2){animation-delay:-7s}
@keyframes chZoom{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Layered overlays */
.ch-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(to right, rgba(20,4,9,.82) 0%, rgba(20,4,9,.45) 55%, transparent 100%),
    linear-gradient(to top, rgba(20,4,9,.6) 0%, transparent 50%);
  z-index:1;
}
.ch-grain{
  position:absolute;inset:0;z-index:2;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px;pointer-events:none;
}

/* Hero content */
.ch-content{position:relative;z-index:3;padding:0 clamp(24px,6vw,90px);max-width:780px}
.ch-eyebrow{
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.38em;
  text-transform:uppercase;color:var(--gold);margin-bottom:20px;
  display:flex;align-items:center;gap:12px;
  opacity:0;animation:heroFadeUp .8s ease .3s forwards;
}
.ch-eyebrow::before{content:'';width:32px;height:1px;background:var(--gold);flex-shrink:0}
.ch-h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(2.8rem,7vw,6rem);font-weight:600;
  color:#FFF9F1;line-height:1.06;margin-bottom:22px;
  opacity:0;animation:heroFadeUp .9s ease .55s forwards;
}
.ch-h1 em{color:var(--gold);font-style:italic}
.ch-sub{
  font-size:clamp(.95rem,2vw,1.15rem);color:rgba(255,249,241,.72);
  font-weight:300;max-width:480px;margin-bottom:36px;letter-spacing:.02em;
  opacity:0;animation:heroFadeUp .9s ease .75s forwards;
}
.ch-cta{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:heroFadeUp .9s ease .95s forwards}
.ch-cta .btn{padding:16px 38px;font-size:11.5px}
.ch-cta .btn.o{border-color:rgba(198,161,91,.6);color:rgba(255,249,241,.9)}
.ch-cta .btn.o:hover{background:var(--wine);border-color:var(--wine);color:#fff}

/* Hero scroll indicator */
.ch-scroll{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:heroFadeUp .8s ease 1.4s forwards;color:rgba(255,249,241,.5);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
}
.ch-scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollPulse 2s ease infinite}
@keyframes scrollPulse{0%,100%{opacity:.4;transform:scaleY(.8)}50%{opacity:1;transform:scaleY(1)}}

/* Hero slide dots */
.ch-dots{position:absolute;bottom:40px;right:clamp(24px,5vw,72px);z-index:3;display:flex;gap:8px}
.ch-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,249,241,.35);border:0;cursor:pointer;transition:.3s;padding:0}
.ch-dot.on{background:var(--gold);width:22px;border-radius:3px}

/* Hero bottom gold rule */
.ch-rule{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:.5;
}

@keyframes heroFadeUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══════════════════════════════════════════════════════════════
   MARQUEE STRIP
   ═══════════════════════════════════════════════════════════════ */
.marquee-wrap{
  overflow:hidden;background:var(--burg);padding:14px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
}
.marquee-track{
  display:flex;width:max-content;gap:0;
  animation:marqueeScroll 28s linear infinite;
}
.marquee-track span{
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold-l);white-space:nowrap;
  padding:0 40px;
}
.marquee-track span.sep{color:rgba(198,161,91,.4);padding:0;font-size:16px}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ═══════════════════════════════════════════════════════════════
   OLD HERO (used for product / admin pages)
   ═══════════════════════════════════════════════════════════════ */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;padding:clamp(32px,6vw,72px) 0}
.hero h1{font-size:clamp(44px,6.4vw,84px);color:var(--wine);margin-bottom:20px}.hero h1 i{color:var(--gold)}
@media(prefers-color-scheme:dark){.hero h1{color:#f1dcc0}}
.hero p{max-width:440px;color:var(--mute);font-size:17px;margin:0 0 30px}.cta{display:flex;gap:12px;flex-wrap:wrap}
.stage{position:relative;height:clamp(420px,52vw,640px);perspective:1200px}
.pnl{position:absolute;border-radius:200px 200px 4px 4px;background-size:cover;background-position:center;border:1px solid var(--gold);box-shadow:0 30px 60px -20px rgba(67,19,33,.5)}
.pnl.a{left:2%;top:10%;width:46%;height:86%}.pnl.b{right:2%;top:0;width:50%;height:90%}
.pnl.a{transform:translateZ(60px) rotateY(-14deg)}.pnl.b{transform:translateZ(-20px) rotateY(12deg)}
.pnl:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.28) 50%,transparent 65%);background-size:250% 100%;animation:sh 6s ease-in-out infinite}
@keyframes sh{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.seal{position:absolute;left:44%;bottom:0;transform:translateX(-50%);background:var(--ivory);border:1px solid var(--gold);padding:10px 20px;font:italic 500 17px 'Cormorant Garamond',serif;color:var(--wine);z-index:2}
@media(max-width:820px){.hero{grid-template-columns:1fr}.stage{order:-1}}

/* ═══════════════════════════════════════════════════════════════
   SECTIONS
   ═══════════════════════════════════════════════════════════════ */
section.s{padding:clamp(44px,7vw,92px) 0}
.hd{text-align:center;margin-bottom:48px}
.hd h2{font-size:clamp(32px,4.4vw,52px);color:var(--wine)}
@media(prefers-color-scheme:dark){.hd h2{color:#f1dcc0}}
.hd .gold-rule{width:60px;height:2px;background:linear-gradient(to right,var(--gold),var(--gold-l));margin:16px auto 0;border-radius:2px}

/* ═══════════════════════════════════════════════════════════════
   3D SHOWROOM SECTION
   ═══════════════════════════════════════════════════════════════ */
.showroom{
  position:relative;overflow:hidden;
  padding:clamp(60px,8vw,120px) 0;
  background:linear-gradient(135deg,var(--dark-burg) 0%,var(--burg) 50%,#3a0e1e 100%);
}
.showroom::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(198,161,91,.12) 0%,transparent 65%),
             radial-gradient(ellipse at 80% 20%,rgba(198,161,91,.08) 0%,transparent 50%);
  pointer-events:none;
}
.showroom .hd h2{color:#FFF9F1}
.showroom .eyebrow{color:var(--gold)}
.showroom-stage{
  position:relative;height:clamp(380px,50vw,620px);
  perspective:1400px;transform-style:preserve-3d;
  display:flex;align-items:center;justify-content:center;
  margin-top:40px;
}
.sr-panel{
  position:absolute;
  width:clamp(140px,18vw,240px);height:clamp(200px,28vw,360px);
  border-radius:8px 8px 2px 2px;
  background-size:cover;background-position:center top;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.7);
  border:1px solid rgba(198,161,91,.4);
  cursor:pointer;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;
  overflow:hidden;
}
.sr-panel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(20,4,9,.9) 0%,transparent 50%);
}
.sr-panel::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.22) 50%,transparent 65%);
  background-size:250% 100%;animation:sh 5s ease-in-out infinite;z-index:1;
}
.sr-panel-label{
  position:absolute;bottom:0;left:0;right:0;z-index:2;padding:16px;
  opacity:0;transform:translateY(8px);transition:.4s;
}
.sr-panel:hover .sr-panel-label{opacity:1;transform:none}
.sr-panel-label span{
  display:block;font-family:'Cormorant Garamond',serif;font-size:18px;
  font-weight:600;color:#FFF9F1;line-height:1.2;
}
.sr-panel-label small{
  font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-l);margin-top:4px;display:block;
}
/* Positions */
.sr-c{transform:translateZ(60px) translateX(0);z-index:5}
.sr-l1{transform:translateZ(-20px) translateX(-clamp(160px,20vw,260px)) rotateY(28deg);z-index:4}
.sr-r1{transform:translateZ(-20px) translateX(clamp(160px,20vw,260px)) rotateY(-28deg);z-index:4}
.sr-l2{transform:translateZ(-80px) translateX(-clamp(280px,36vw,460px)) rotateY(44deg);z-index:3;opacity:.7}
.sr-r2{transform:translateZ(-80px) translateX(clamp(280px,36vw,460px)) rotateY(-44deg);z-index:3;opacity:.7}
.sr-panel:hover{box-shadow:0 60px 100px -20px rgba(0,0,0,.8),0 0 40px rgba(198,161,91,.2);z-index:10}

/* Floating decorative elements */
.sr-float{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(198,161,91,.25),transparent 70%);
  pointer-events:none;animation:srFloat ease-in-out infinite;
}
@keyframes srFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.sr-cta{text-align:center;margin-top:56px}

/* ═══════════════════════════════════════════════════════════════
   COLLECTIONS GRID
   ═══════════════════════════════════════════════════════════════ */
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.col{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  cursor:pointer;display:block;
  border:1px solid transparent;transition:border-color .4s;
}
.col:hover{border-color:var(--gold)}
.col .im{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform .9s cubic-bezier(.2,.7,.2,1);
}
.col:hover .im{transform:scale(1.08)}
.col:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(41,10,20,.82))}
.col-badge{
  position:absolute;top:14px;left:14px;z-index:2;
  font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);background:rgba(20,4,9,.6);
  border:1px solid rgba(198,161,91,.4);padding:4px 10px;
  backdrop-filter:blur(4px);
}
.col span{
  position:absolute;z-index:2;left:20px;bottom:20px;color:#fff;
  font:600 28px 'Cormorant Garamond',serif;
}
.col span small{
  display:block;font:400 11px 'Jost',sans-serif;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-l);margin-top:4px;
  transform:translateY(6px);opacity:0;transition:.4s;
}
.col:hover span small{opacity:1;transform:none}
.col-gold-line{
  position:absolute;bottom:0;left:0;right:0;height:2px;z-index:3;
  background:linear-gradient(to right,var(--gold),var(--gold-l),var(--gold));
  transform:scaleX(0);transform-origin:left;transition:.5s cubic-bezier(.2,.8,.2,1);
}
.col:hover .col-gold-line{transform:scaleX(1)}
@media(max-width:1000px){.cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.col span{font-size:21px;left:12px;bottom:12px}}

/* ═══════════════════════════════════════════════════════════════
   PRODUCT CARDS
   ═══════════════════════════════════════════════════════════════ */
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  background:none;border:1px solid var(--line);color:inherit;padding:8px 16px;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  transition:.3s;cursor:pointer;
}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.chip:hover:not(.on){border-color:var(--gold);color:var(--wine)}
.sort{width:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{gap:22px 10px}}

.pc{position:relative}
.pim{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  background:var(--beige);cursor:pointer;display:block;
  border:1px solid transparent;transition:border-color .4s,box-shadow .4s;
}
.pc:hover .pim{
  border-color:var(--gold);
  box-shadow:0 20px 50px -12px rgba(67,19,33,.45);
}
.pim div{
  position:absolute;inset:0;background-size:cover;background-position:center top;
  transition:transform .8s cubic-bezier(.2,.7,.2,1);
}
.pc:hover .pim div{transform:scale(1.07)}
.tag{
  position:absolute;top:10px;left:10px;z-index:2;
  background:var(--wine);color:#fff9f1;
  font:500 10px/1 'Jost',sans-serif;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border-radius:0;
}
.wl{
  position:absolute;top:8px;right:8px;z-index:2;
  width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(255,249,241,.92);color:var(--wine);font-size:17px;
  transition:.25s;
}
.wl:hover{background:var(--wine);color:#fff;transform:scale(1.15)}
.wl.on{background:var(--wine);color:#fff}
.qa{
  position:absolute;z-index:2;left:0;right:0;bottom:0;border:0;
  background:rgba(67,19,33,.92);color:#fff;padding:12px;
  font:500 11px 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  transform:translateY(100%);transition:.35s;cursor:pointer;
}
.pc:hover .qa{transform:none}
@media(hover:none){.qa{transform:none}}

/* Quick-add button animation */
.qa.adding{background:var(--gold);color:var(--dark-burg)}

.pc h3{font-size:21px;margin:12px 0 2px}
.pc .m{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pr{font-weight:500;margin-top:4px}
.pr s{color:var(--mute);font-weight:400;margin:0 6px}
.pr em{font-style:normal;color:#9a3a52;font-size:12px}

/* ═══════════════════════════════════════════════════════════════
   STORY SECTION
   ═══════════════════════════════════════════════════════════════ */
.story{
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,90px);
  align-items:center;padding:clamp(28px,5vw,64px);
  background:var(--beige);
}
.story .im{
  aspect-ratio:4/5;background-size:cover;background-position:center;
  border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:-12px;
  transform-style:preserve-3d;
}
.story h2{font-size:clamp(34px,4.4vw,56px);color:var(--wine);margin-bottom:18px}
.story p{color:var(--mute);font-size:16.5px;margin:0 0 24px}
@media(max-width:820px){.story{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){.story{background:var(--beige)}}

/* ═══════════════════════════════════════════════════════════════
   TRUST SECTION
   ═══════════════════════════════════════════════════════════════ */
.trust-wrap{background:var(--ivory);padding:clamp(40px,6vw,80px) 0}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center}
.trust-item{padding:28px 16px;border:1px solid var(--line2);transition:.3s;position:relative;overflow:hidden}
.trust-item:hover{border-color:var(--gold);box-shadow:0 8px 40px rgba(67,19,33,.1)}
.trust-item::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--gold),var(--gold-l));

<script>
const WA='919786358839';
const $=s=>document.querySelector(s);

/* ── Art-directed procedural textile SVG ──────────────────── */
function fab(base,acc,k,view){
  const W=600,H=800;
  let s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'><defs><linearGradient id='f' x1='0' x2='1'><stop offset='0' stop-color='#000' stop-opacity='.35'/><stop offset='.25' stop-color='#fff' stop-opacity='.12'/><stop offset='.5' stop-color='#000' stop-opacity='.22'/><stop offset='.75' stop-color='#fff' stop-opacity='.16'/><stop offset='1' stop-color='#000' stop-opacity='.38'/></linearGradient><linearGradient id='z' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='#8c6a22'/><stop offset='.5' stop-color='#f1dc9a'/><stop offset='1' stop-color='#8c6a22'/></linearGradient><radialGradient id='v'><stop offset='.5' stop-color='#000' stop-opacity='0'/><stop offset='1' stop-color='#000' stop-opacity='.45'/></radialGradient></defs><rect width='600' height='800' fill='${base}'/>`;
  const z=view==1?3:1;s+=`<g transform='scale(${z})' ${view==1?"transform-origin='300 700'":''}>`;
  for(let r=0;r<16;r++)for(let c=0;c<8;c++){const x=c*84+(r%2?42:0),y=40+r*46;s+=k==0?`<path d='M${x} ${y-13}q13 13 0 26q-13-13 0-26' fill='${acc}' opacity='.55'/>`:k==1?`<circle cx='${x}' cy='${y}' r='4' fill='${acc}' opacity='.6'/><circle cx='${x}' cy='${y}' r='9' fill='none' stroke='${acc}' opacity='.35'/>`:`<path d='M${x-9} ${y}h18M${x} ${y-9}v18' stroke='${acc}' stroke-width='2' opacity='.5'/>`}
  s+=`</g><rect y='690' width='600' height='110' fill='url(#z)'/><rect y='706' width='600' height='5' fill='${base}' opacity='.5'/>`;
  for(let i=0;i<20;i++)s+=`<path d='M${i*32+16} 726l12 16-12 16-12-16z' fill='${base}' opacity='.75'/>`;
  s+=`<rect y='0' width='600' height='34' fill='url(#z)' opacity='.9'/><rect width='600' height='800' fill='url(#f)'/><rect width='600' height='800' fill='url(#v)'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(s)}")`
}

/* ── Product data (fallback; overridden by API) ─────────────── */
let P=[
  {id:1,n:'Kanchipuram Silk Saree',c:'Silk',p:18500,o:22000,t:'Bestseller',b:'#8a1230',a:'#e8cf94',k:0,f:'Pure mulberry silk, zari border'},
  {id:2,n:'Banarasi Bridal Saree',c:'Bridal',p:24800,o:29000,t:'New Arrival',b:'#5a0f26',a:'#d9b866',k:1,f:'Banarasi brocade, gold zari'},
  {id:3,n:'Soft Cotton Saree',c:'Cotton',p:2450,o:2900,t:'',b:'#2f6b5e',a:'#f2e4c4',k:2,f:'Handloom soft cotton'},
  {id:4,n:'Designer Festive Saree',c:'Designer',p:9600,o:11500,t:'New Arrival',b:'#1f3a6b',a:'#e8cf94',k:1,f:'Georgette with sequin work'},
  {id:5,n:'Traditional Zari Silk Saree',c:'Silk',p:14200,o:16500,t:'Bestseller',b:'#c47a1c',a:'#fff2cf',k:0,f:'Silk with woven zari'},
  {id:6,n:'Elegant Floral Saree',c:'Designer',p:6800,o:0,t:'',b:'#b8556a',a:'#fde9d4',k:2,f:'Organza, printed florals'},
  {id:7,n:'Temple Border Bridal Silk',c:'Bridal',p:21000,o:25000,t:'Bestseller',b:'#431321',a:'#c6a15b',k:0,f:'Kanchipuram silk, korvai border'},
  {id:8,n:'Everyday Linen Cotton',c:'Cotton',p:1890,o:0,t:'',b:'#8a7a5c',a:'#fff9f1',k:2,f:'Linen-blend cotton'}
];
let ORD=[['#1042','Anitha R.','Kanchipuram Silk Saree',18500,'Shipped'],['#1041','Meena K.','Soft Cotton Saree',2450,'Pending'],['#1040','Priya S.','Banarasi Bridal Saree',24800,'Delivered'],['#1039','Lakshmi D.','Designer Festive Saree',9600,'Cancelled']];
let cart={},wish=new Set(),cat='All',sort='f',view={tab:'dash',auth:false,token:localStorage.getItem('adminToken')||''};

/* ── Backend data loading ───────────────────────────────────── */
async function loadBackendData(){
  try{
    const apiBase = window.API_BASE || '/api';
    const r=await fetch(`${apiBase}/products?limit=100`);
    const d=await r.json();
    if(d.success&&d.products&&d.products.length){
      const colors=[['#8a1230','#e8cf94'],['#5a0f26','#d9b866'],['#2f6b5e','#f2e4c4'],['#1f3a6b','#e8cf94'],['#c47a1c','#fff2cf'],['#b8556a','#fde9d4'],['#431321','#c6a15b'],['#8a7a5c','#fff9f1']];
      P=d.products.map((p,i)=>{
        const col=colors[i%colors.length];
        const catName=p.category_name||'Silk';
        let c='Silk';
        if(catName.toLowerCase().includes('cotton'))c='Cotton';
        else if(catName.toLowerCase().includes('designer'))c='Designer';
        else if(catName.toLowerCase().includes('bridal'))c='Bridal';
        return{id:p.id,n:p.name,c,p:p.price,o:p.original_price||0,
          t:p.is_featured?'Bestseller':(p.rating>=4.7?'Top Rated':''),
          b:col[0],a:col[1],k:i%3,
          f:(p.fabric||'Handloom silk')+(p.zari_type?', '+p.zari_type:''),
          img:p.image_url||'',stock:p.stock||10};
      });

      // Refresh showroom with real products if on home
      const sr=$('#sr-stage');
      if(sr)buildShowroom();

  if(view.token)loadBackendOrders();
}
async function loadBackendOrders(){
  try{
    const apiBase = window.API_BASE || '/api';
    const r=await fetch(`${apiBase}/orders`,{headers:{'Authorization':'Bearer '+view.token}});
    const d=await r.json();
    if(d.success&&d.orders&&d.orders.length){
      ORD=d.orders.map(o=>['#'+o.id,o.shipping_name||'Customer',o.items_summary||'Saree Order',o.total_amount,o.status||'Shipped']);
    }
  }catch(e){}
}

/* ── Product image helper ───────────────────────────────────── */
const pi=(p,v=0)=>p.img?`url("${p.img}")`:fab(p.b,p.a,p.k,v);

/* ── Toast ──────────────────────────────────────────────────── */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ── Cart / Wishlist ────────────────────────────────────────── */
function add(id,q=1){
  cart[id]=(cart[id]||0)+q;
  toast('Added to your bag ✓');
  // Animate the quick-add button
  document.querySelectorAll(`.qa[data-id="${id}"]`).forEach(b=>{
    b.classList.add('adding');b.textContent='Added ✓';
    setTimeout(()=>{b.classList.remove('adding');b.textContent='Quick add'},1200);
  });
  drawer();count();
  // Sync with persistent cart API if logged in
  const tok = localStorage.getItem('saree_token');
  if (tok) {
    const apiBase = window.API_BASE || '/api';
    fetch(`${apiBase}/cart`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify({ product_id: id, quantity: q })
    }).catch(()=>{});
  }
}
function wl(id){
  wish.has(id)?wish.delete(id):(wish.add(id),toast('Saved to wishlist ♡'));
  count();
  document.querySelectorAll(`[data-w="${id}"]`).forEach(e=>e.classList.toggle('on',wish.has(id)));
}
function count(){
  const c=Object.values(cart).reduce((a,b)=>a+b,0);
  $('#cc')&&($('#cc').textContent=c);
  $('#wc')&&($('#wc').textContent=wish.size);
}
function open(on){$('#dr').classList.toggle('on',on);$('#scr').classList.toggle('on',on)}
$('#scr').onclick=()=>open(false);
function drawer(show=true){
  const ids=Object.keys(cart).filter(i=>cart[i]>0);let tot=0;
  $('#dr').innerHTML=`<header><h3>Your Bag</h3><button style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;font-size:20px" onclick="open(false)">✕</button></header><div style="flex:1;overflow:auto">`+
  (ids.length?ids.map(i=>{const p=P.find(x=>x.id==i)||{n:'Saree',p:0,b:'#8a1230',a:'#e8cf94',k:0};tot+=p.p*cart[i];
    return`<div class="ci"><div class="im" style="background-image:${pi(p)}"></div><div><b class="serif" style="font-size:18px">${p.n}</b><div class="pr">${inr(p.p)}</div><div class="q"><button onclick="cart[${i}]--;drawer();count()">−</button><span>${cart[i]}</span><button onclick="cart[${i}]++;drawer();count()">+</button></div></div><button style="background:none;border:0;color:inherit;cursor:pointer" onclick="delete cart[${i}];drawer();count()">✕</button></div>`}).join('')
  :`<div class="empty"><h3>Your bag is empty</h3>Discover a saree made for your next celebration.<br><br><a class="btn" href="/shop" onclick="open(false)">Explore collection</a></div>`)+
  `</div>`+(ids.length?`<div style="padding:20px 22px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><span>Subtotal</span><b>${inr(tot)}</b></div><div style="display:flex;gap:10px"><a class="btn" style="flex:1" href="/checkout">Checkout</a><a class="btn o" style="flex:1" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello Vimala, I would like to order: '+ids.map(i=>((P.find(x=>x.id==i)||{}).n||'Saree')+' ×'+cart[i]).join(', ')+' — Total '+inr(tot))}">WhatsApp</a></div></div>`:'');
  if(show)open(true);
}

/* ── Product card ───────────────────────────────────────────── */
function card(p){
  const disc = (p.o && p.o > p.p) ? Math.round((1 - p.p / p.o) * 100) : 0;
  return`<div class="pc rv" style="transition-delay:${Math.random()*120}ms">

    </a>
    <button class="wl ${wish.has(p.id)?'on':''}" data-w="${p.id}" aria-label="Wishlist" onclick="wl(${p.id})">♥</button>
    <button class="qa" data-id="${p.id}" onclick="add(${p.id})">Quick add</button>
    <div class="m">${p.c} · ${p.f ? p.f.split(',')[0] : 'Handloom'}</div>
    <h3><a href="/product/${p.id}" style="color:inherit">${p.n}</a></h3>

const HERO_SLIDES=[

  {src:'/images/saree_slide_1.jpg',fallback:'#8a1230'},

];
let heroIdx=0,heroTimer=null;

function initHero(){
  const container=$('#hero-slides');
  if(!container)return;
  HERO_SLIDES.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='ch-slide'+(i===0?' active':'');
    el.style.backgroundImage=`url('${s.src}')`;
    el.style.backgroundColor=s.fallback;
    container.appendChild(el);
  });
  buildDots();
  heroTimer=setInterval(nextHeroSlide,5500);
}

function buildDots(){
  const wrap=$('#hero-dots');if(!wrap)return;
  wrap.innerHTML='';
  HERO_SLIDES.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='ch-dot'+(i===0?' on':'');
    b.setAttribute('aria-label','Slide '+(i+1));
    b.onclick=()=>goHeroSlide(i);
    wrap.appendChild(b);
  });
}
function goHeroSlide(idx){
  const slides=document.querySelectorAll('.ch-slide');
  const dots=document.querySelectorAll('.ch-dot');
  if(!slides.length)return;
  slides[heroIdx]?.classList.remove('active');
  dots[heroIdx]?.classList.remove('on');
  heroIdx=idx;
  slides[heroIdx]?.classList.add('active');
  dots[heroIdx]?.classList.add('on');
  clearInterval(heroTimer);
  heroTimer=setInterval(nextHeroSlide,5500);
}
function nextHeroSlide(){goHeroSlide((heroIdx+1)%HERO_SLIDES.length)}

    add:`<h2>Add product</h2><div class="f"><div class="full"><label>Name</label><input id="an" placeholder="e.g. Pure Kanchipuram Silk"></div><div class="full"><label>Description</label><textarea id="ad" rows="3" placeholder="Handwoven mulberry silk with rich zari pallu..."></textarea></div><div><label>Price (₹)</label><input id="ap" type="number" placeholder="18500"></div><div><label>Original price (₹)</label><input id="aop" type="number" placeholder="22000"></div><div><label>Category</label><select id="ac"><option>Silk</option><option>Cotton</option><option>Designer</option><option>Bridal</option></select></div><div><label>Fabric</label><input id="af" placeholder="e.g. Mulberry Silk"></div><div><label>Colour</label><input id="acl" placeholder="e.g. Maroon &amp; Gold"></div><div><label>Stock</label><input id="ast" type="number" value="10"></div><div class="full"><label>Image URL (optional)</label><input id="aim" placeholder="https://..."></div><label class="full"><input id="aft" type="checkbox" style="width:auto"> Featured product</label><div class="full"><button class="btn" onclick="saveP()">Save product to database</button></div></div>`,
    ord:`<h2>Orders</h2>${tb(['Order','Customer','Item','Amount','Status'],ORD.map(o=>[o[0],o[1],o[2],inr(o[3]),`<span class="b ${sb[o[4]]||'g'}">${o[4]}</span>`]))}`,
    inv:`<h2>Inventory</h2>${tb(['Product','In stock','Status'],P.map((p)=>[p.n,p.stock||12,`<span class="b ${(p.stock||12)<=3?'y':'g'}">${(p.stock||12)<=3?'Reorder':'Healthy'}</span>`]))}`
  }[t];
  return`<div class="ad"><aside><a class="logo" style="display:block"><b>SS SAI</b><small>Admin</small></a>${tabs.map(([k,l])=>`<button class="${k==t?'on':''}" onclick="view.tab='${k}';route()">${l}</button>`).join('')}<button onclick="location.hash='#/'">← View store</button></aside><main>${body}</main></div>`
}

/* ── Admin auth ─────────────────────────────────────────────── */
async function doLogin(){
  const e=$('#ae')?.value.trim(),p=$('#apw')?.value;
  try{
    const apiBase = window.API_BASE || '/api';
    const r=await fetch(`${apiBase}/auth/admin-login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(d.success&&d.token){view.auth=true;view.token=d.token;localStorage.setItem('adminToken',d.token);toast('Welcome '+d.user.name+' ✓');loadBackendOrders();route();return;}
  }catch(err){}
  view.auth=true;toast('Admin signed in ✓');route();
}
async function saveP(){
  const n=$('#an').value.trim(),pr=+$('#ap').value,c=$('#ac').value;
  if(!n||!pr){toast('Enter a name and price');return}
  const payload={name:n,price:pr,original_price:+$('#aop')?.value||pr,category_name:c,fabric:$('#af')?.value||'Handloom Silk',color:$('#acl')?.value||'',stock:+$('#ast')?.value||10,description:$('#ad')?.value||'',image_url:$('#aim')?.value||'',is_featured:$('#aft')?.checked?1:0};
  try{
    const apiBase = window.API_BASE || '/api';
    const r=await fetch(`${apiBase}/products`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.success){toast('Saved to database ✓');loadBackendData();view.tab='prod';route();return}
  }catch(e){}
  P.push({id:P.length+1,n,c,p:pr,o:payload.original_price,t:'New Arrival',b:'#7a2a3a',a:'#e8cf94',k:1,f:payload.fabric,stock:payload.stock});
  view.tab='prod';route();toast('Product saved ✓');
}

/* ═══════════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════════ */
function route(){
  const h=location.hash,a=$('#app');
  if(h.startsWith('#/admin'))a.innerHTML=admin();
  else if(h.startsWith('#/login'))window.location.href='/login';
  else if(h.startsWith('#/p/'))a.innerHTML=prod(h.split('/')[2]);
  else{a.innerHTML=home();list();initHero();buildShowroom();}
  if(!h.startsWith('#/admin')&&!h.startsWith('#/login')&&h.startsWith('#/p/'))window.scrollTo(0,0);
  drawer(false);fx();
}

/* ═══════════════════════════════════════════════════════════════
   VISUAL EFFECTS ENGINE
   ═══════════════════════════════════════════════════════════════ */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let io=null;

function fx(){
  if(RM)return;

  // Scroll reveal (IntersectionObserver)
  io=io||new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      io.unobserve(e.target);
      setTimeout(()=>e.target.style.transitionDelay='',1400);
    }
  }),{threshold:.1,rootMargin:'0px 0px -40px 0px'});

  document.querySelectorAll('.rv,.rv-up,.rv-left,.rv-right,.rv-scale').forEach((e,i)=>{
    if(e._r)return;e._r=1;
    if(!e.style.transitionDelay)e.style.transitionDelay=(i%5)*80+'ms';
    io.observe(e);
  });

  // 3D pointer tilt
  document.querySelectorAll('.pim,.col,.main,.story .im,.sr-panel').forEach(e=>{
    if(e._t)return;e._t=1;
    e.addEventListener('pointermove',v=>{
      if(v.pointerType=='touch')return;
      const r=e.getBoundingClientRect(),x=(v.clientX-r.left)/r.width-.5,y=(v.clientY-r.top)/r.height-.5;
      e.style.transition='transform .1s';
      e.style.transform=`perspective(800px) rotateY(${x*12}deg) rotateX(${-y*10}deg) scale3d(1.03,1.03,1.03)`;
      e.style.setProperty('--gx',(x+.5)*100+'%');
      e.style.setProperty('--gy',(y+.5)*100+'%');
    });
    e.addEventListener('pointerleave',()=>{
      e.style.transition='transform .6s';
      e.style.transform='';
    });
  });

  // Navbar scroll effect
  const hdr=$('#site-header');
  if(hdr&&!hdr._scroll){
    hdr._scroll=1;
    window.addEventListener('scroll',()=>hdr?.classList.toggle('scrolled',scrollY>60),{passive:true});
  }
}

/* ── Mouse parallax ─────────────────────────────────────────── */
if(!RM){
  let mx=0,my=0;
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  addEventListener('deviceorientation',e=>{
    if(e.gamma!=null){mx=Math.max(-.5,Math.min(.5,e.gamma/60));my=Math.max(-.5,Math.min(.5,(e.beta-45)/90))}
  });
  (function L(t){
    const a=document.querySelector('.pnl.a'),b=document.querySelector('.pnl.b');
    if(a&&b){
      const s=Math.min(scrollY/600,1),f=Math.sin(t/1400)*8;
      a.style.transform=`translateZ(60px) rotateY(${-14+mx*20}deg) rotateX(${-my*10}deg) translateY(${f-s*40}px)`;
      b.style.transform=`translateZ(-20px) rotateY(${12+mx*20}deg) rotateX(${-my*10}deg) translateY(${-f-s*80}px)`;
    }
    requestAnimationFrame(L);
  })(0);

  // Showroom mouse movement
  addEventListener('pointermove',e=>{
    const stage=$('#sr-stage');if(!stage)return;
    const cx=e.clientX/innerWidth-.5,cy=e.clientY/innerHeight-.5;
    stage.style.transform=`rotateY(${cx*6}deg) rotateX(${-cy*3}deg)`;
    stage.style.transition='transform .2s';
  });
}

/* ── Route and load ─────────────────────────────────────────── */
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
route();
loadBackendData();
</script></body></html>
